; RoundControl - a php-fpm pool of its own for Roundcube + the mail panel.
; install.sh section 1b renders this template to /etc/php/<version>/fpm/pool.d/@POOL@.conf
; (@PANEL_USER@ / @APACHE_USER@ / @SOCKET@ / @SESSION_DIR@ are filled in there).
;
; Why: in the default setup ONE pool [www] (user www-data) runs every PHP site of the server. Then any flaw in any
; of them (forum, tracker, files ...) runs as the same user as the webmail: it can read the panel's database
; password and Roundcube's des_key, and use every sudo rule the panel has. With this pool only Roundcube and the panel
; run as @PANEL_USER@; the panel's secrets are root:@PANEL_USER@ 640 and its sudo rules name @PANEL_USER@, not www-data.
; The other sites stay in [www]. One php-fpm master serves all pools, so the systemd drop-in with ReadWritePaths
; (install.sh section 10) applies to this pool as well.
[@POOL@]
user = @PANEL_USER@
group = @PANEL_USER@

; Apache (@APACHE_USER@) connects through this socket; nobody else may.
listen = @SOCKET@
listen.owner = @APACHE_USER@
listen.group = @APACHE_USER@
listen.mode = 0660

; A mail panel for a handful of people: processes start on demand and exit when idle, so the pool costs no memory
; while nobody uses the webmail.
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 60s
pm.max_requests = 500

; Sessions of the portal and the panel live in this pool's own directory (0700 @PANEL_USER@): other pools cannot read
; them. Debian's phpsessionclean timer only cleans the path from php.ini, so this pool collects its own garbage
; (1 % of requests; 2 h without activity - the panel itself logs an idle admin out after 1 h). Roundcube keeps its
; sessions in the database and sets its own lifetime; its database garbage collector runs on the same probability.
php_admin_value[session.save_path] = @SESSION_DIR@
php_value[session.gc_probability] = 1
php_value[session.gc_divisor] = 100
php_value[session.gc_maxlifetime] = 7200
