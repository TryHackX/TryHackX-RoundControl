# /etc/fail2ban/filter.d/mailpanel-portal.conf  (1.1.0)
# Failed logins at the portal (webmail and admin panel), written to syslog by the portal itself
# (identifier "mailpanel", facility auth):
#     auth-failure ip=203.0.113.7 kind=admin user=someone%40example.org
# The IP is REMOTE_ADDR and stands FIRST; the user name typed by the client is URL-encoded and stands LAST, so a
# client cannot smuggle a second "ip=" into the match. Use with backend = systemd (see the jail in
# jail.d/mailpanel.local, disabled by default).
[Definition]
failregex = ^auth-failure ip=<HOST> kind=(?:admin|webmail) user=\S*$
ignoreregex =
journalmatch = SYSLOG_IDENTIFIER=mailpanel
