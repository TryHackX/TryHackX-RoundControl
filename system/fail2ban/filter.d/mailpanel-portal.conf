# /etc/fail2ban/filter.d/mailpanel-portal.conf  (1.2.0)
# Failed logins at the portal (webmail and admin panel), written to syslog by the portal itself
# (identifier "mailpanel", facility auth):
#     auth-failure ip=203.0.113.7 kind=admin user=someone%40example.org
# The IP is REMOTE_ADDR and stands FIRST; the user name typed by the client is URL-encoded and stands LAST, so a
# client cannot smuggle a second "ip=" into the match. Use with backend = systemd (see the jail in
# jail.d/mailpanel.local, disabled by default).
#
# 1.2.0: the line Fail2Ban matches is "<host> mailpanel[<pid>]: auth-failure ..." (the journal backend puts the host
# and the identifier in front of the message, and a file backend leaves them after cutting the date). The 1.1.0 regex
# started with ^auth-failure and therefore NEVER matched; this one allows that prefix. Check after an upgrade:
#     fail2ban-regex 'Oct 13 12:00:00 mail mailpanel[1]: auth-failure ip=203.0.113.7 kind=admin user=x' mailpanel-portal
#     (-> "1 matched")
#
# Deliberately NOT matched: "reauth-failure ip=... kind=admin ..." — a wrong admin password typed into the confirmation
# prompt of a destructive panel action (deleting an account, changing the admin password). That is a typo of an admin who
# is already logged in; guessing through that prompt is stopped by the panel itself (the admin session ends after a few
# wrong passwords) and every attempt is in the panel's audit log. Banning on it would cut the admin off the panel and the
# webmail for `bantime`. If you want it anyway, add a second line under failregex:
#     ^\s*(?:\S+\s+)?mailpanel(?:\[\d+\])?:\s+reauth-failure ip=<HOST> kind=admin user=\S*$
[Definition]
failregex = ^\s*(?:\S+\s+)?mailpanel(?:\[\d+\])?:\s+auth-failure ip=<HOST> kind=(?:admin|webmail) user=\S*$
ignoreregex =
journalmatch = SYSLOG_IDENTIFIER=mailpanel
