# /etc/fail2ban/filter.d/panel-tempban.conf
# Jail dla CZASOWYCH blokad z panelu (skaner: 1h..3 miesiące). Panel ustawia
# bantime tuż przed banip, więc każdy ban ma własny okres. Filtr nic nie łapie
# automatycznie — tylko ręczne `set panel-tempban banip <IP>`.
[Definition]
failregex = ^__mailpanel_tempban_never_match__ <HOST>$
ignoreregex =
