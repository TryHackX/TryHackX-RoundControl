# /etc/fail2ban/filter.d/panel-tempban.conf
# Jail for TIMED blocks from the panel (1 hour .. 90 days). The panel sets bantime right
# before banip, so every ban has its own duration. The filter never matches anything by
# itself — only manual `set panel-tempban banip <IP>`.
[Definition]
failregex = ^__mailpanel_tempban_never_match__ <HOST>$
ignoreregex =
