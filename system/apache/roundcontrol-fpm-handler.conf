    # RoundControl: PHP of Roundcube + the panel runs in their own php-fpm pool (user @PANEL_USER@), not in the shared
    # [www] pool. Nested in <Directory> (inside the <VirtualHost>) it overrides the server-wide handler from
    # conf-enabled/php*-fpm.conf for files under @RC_DIR@ ONLY: global aliases such as /phpmyadmin keep the [www]
    # pool even on this host name (a vhost-wide FilesMatch would run them as @PANEL_USER@, next to the panel's secrets).
    <Directory "@RC_DIR@">
        <FilesMatch "\.ph(?:ar|p|tml)$">
            SetHandler "proxy:unix:@SOCKET@|fcgi://localhost"
        </FilesMatch>
    </Directory>
